[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "specter"
version = "0.5.0"
description = "Staging-only AI web-agent with multi-provider protection classification, token-lifecycle management, and vision-based decision support"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT + ethics clause (see LICENSE)" }
authors = [
    { name = "letticha" }
]
keywords = [
    "anti-bot", "protection-detection", "cloudflare", "aws-waf",
    "ai-agent", "web-scraping", "security-testing", "staging",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    # minimal — only what is used at runtime. Frozen cf_selenium / cf_persistent
    # are vendored as siblings (see README), not listed here.
    "pillow>=10.0",
    "requests>=2.31",
]

[project.optional-dependencies]
vision = [
    # Tesseract is an OS-level binary, install separately:
    #   apt install tesseract-ocr
    #   pkg install tesseract
    "anthropic>=0.20.0",  # for Claude Vision (optional, env-gated)
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "mypy>=1.10",
    "ruff>=0.4",
]

[project.scripts]
specter = "specter.__main__:main"

[project.urls]
Homepage = "https://github.com/letticha/specter"
Issues = "https://github.com/letticha/specter/issues"
Changelog = "https://github.com/letticha/specter/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["specter", "specter.providers", "specter.vision"]

[tool.setuptools.package-data]
specter = ["py.typed"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008", "B904"]  # line-length, function-call-in-default, raise-without-from

[tool.mypy]
python_version = "3.11"
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true  # cf_selenium, cf_persistent are external

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "browser: marks tests that need Chromium",
    "network: marks tests that need real network",
]
