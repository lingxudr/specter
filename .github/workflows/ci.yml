name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    name: Python syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Byte-compile all sources
        run: |
          python -m compileall -q specter tests examples
      - name: Import smoke test
        run: |
          python -c "import specter; from specter import AIWebAgent; print('OK', specter.__version__)"

  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff
        run: ruff check specter tests examples

  test-no-browser:
    name: No-browser tests (token + detector)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          pip install pillow requests
      - name: Run no-browser tests
        run: |
          # token lifecycle test does not need a browser
          python3 tests/test_aws_waf_token.py
